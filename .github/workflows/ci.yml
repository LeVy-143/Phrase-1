name: Phase 1 offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m evals.run --all --label ci
      - name: Upload real evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evaluation
          path: runtime/evals/
